# ─── Environment variables ────────────────────────────────────────────────────
#
# Required for private GitHub dependencies:
#   GH_TOKEN                    GitHub token with repository read access
#
# C++ library stacks (metkit, fdb, fdb-gribjump, mars) are NOT built here.
# fdb-worker and mars-worker pull pre-built library images from ECCR (pinned
# via their *_LIBS_IMAGE build args; see docker/cpp-libs/ and cpp-libs.yaml).
# polytope-fe-worker uses PyPI manylinux wheels (pyfdb, pygribjump[binary])
# that bundle their own C++ stack — no separate ECCR image required.
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: polytope-server

# Dockerfiles own build defaults. Skaffold passes only credentials and external
# repository locations that cannot have safe image defaults.

# ─── Build ────────────────────────────────────────────────────────────────────

build:
  artifacts:
    - image: eccr.ecmwf.int/polytope/frontend
      context: .
      docker:
        dockerfile: frontend/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

    - image: eccr.ecmwf.int/polytope/polytope-fe-worker
      context: .
      docker:
        dockerfile: workers/polytope-fe-worker/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

    - image: eccr.ecmwf.int/polytope/fdb-worker
      context: .
      docker:
        dockerfile: workers/fdb-worker/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

    - image: eccr.ecmwf.int/polytope/mars-worker
      context: .
      docker:
        dockerfile: workers/mars-worker/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

    - image: eccr.ecmwf.int/polytope/test-worker
      context: .
      docker:
        dockerfile: workers/test-worker/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

    - image: eccr.ecmwf.int/polytope/polytope-loadgen
      context: .
      docker:
        dockerfile: loadgen/Dockerfile
        target: release
        secrets:
          - id: GIT_AUTH_TOKEN
            env: GH_TOKEN
        buildArgs:
          VERSION: '{{ default "" .VERSION }}'
          REVISION: '{{ default "" .REVISION }}'

  tagPolicy:
    customTemplate:
      template: '{{if .FIXED_TAG}}{{.FIXED_TAG}}{{else}}{{.PREFIX}}{{.GIT_TAG}}{{end}}'
      components:
        - name: FIXED_TAG
          envTemplate:
            template: '{{default "" .FIXED_TAG}}'
        - name: PREFIX
          envTemplate:
            template: '{{default "" .PREFIX}}'
        - name: GIT_TAG
          gitCommit:
            ignoreChanges: true
  platforms:
    - linux/amd64
  local:
    useDockerCLI: true
    useBuildkit: true
    concurrency: 2

# ─── Profiles ─────────────────────────────────────────────────────────────────

profiles:
  # ── Legacy Kaniko profile ──────────────────────────────────────────────────
  #
  # Application Dockerfiles now use BuildKit secret mounts for private Git
  # dependencies. Kaniko does not support those mounts, so this profile is
  # retained only as migration reference and must not be used for app images.
  #
  # Prerequisites:
  #   1. Create ~/.docker/kaniko-config.json with registry credentials:
  #      docker login eccr.ecmwf.int --username '<robot-user>' --password '<pass>'
  #      cp ~/.docker/config.json ~/.docker/kaniko-config.json
  #      (or create the JSON manually — see Docker config.json format)
  #
  #   2. Ensure the build service account can create pods in the namespace.
  #   3. The cache repo (eccr.ecmwf.int/polytope/kaniko-cache) must be
  #      writable by the build credentials.
  #
  - name: kaniko
    patches:
      - op: remove
        path: /build/local
      - op: add
        path: /build/cluster
        value:
          dockerConfig:
            path: ~/.docker/kaniko-config.json
          randomDockerConfigSecret: true
          timeout: 60m
          concurrency: 0
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "4"
              memory: 12Gi

      - op: remove
        path: /build/artifacts/0/docker
      - op: add
        path: /build/artifacts/0/kaniko
        value:
          dockerfile: frontend/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

      - op: remove
        path: /build/artifacts/1/docker
      - op: add
        path: /build/artifacts/1/kaniko
        value:
          dockerfile: workers/polytope-fe-worker/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

      - op: remove
        path: /build/artifacts/2/docker
      - op: add
        path: /build/artifacts/2/kaniko
        value:
          dockerfile: workers/fdb-worker/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

      - op: remove
        path: /build/artifacts/3/docker
      - op: add
        path: /build/artifacts/3/kaniko
        value:
          dockerfile: workers/mars-worker/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

      - op: remove
        path: /build/artifacts/4/docker
      - op: add
        path: /build/artifacts/4/kaniko
        value:
          dockerfile: workers/test-worker/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

      - op: remove
        path: /build/artifacts/5/docker
      - op: add
        path: /build/artifacts/5/kaniko
        value:
          dockerfile: loadgen/Dockerfile
          target: release
          skipUnusedStages: true
          useNewRun: true
          cache:
            repo: eccr.ecmwf.int/polytope/kaniko-cache
            cacheTTL: 480h
          buildArgs:
            GIT_AUTH_TOKEN: '{{ .GH_TOKEN }}'
            VERSION: '{{ default "" .VERSION }}'
            REVISION: '{{ default "" .REVISION }}'

  # Buildx is opt-in: normal local builds continue to use Skaffold's Docker
  # builder, while this profile imports the shared ECCR cache. Set
  # BUILDKIT_CACHE_MODE=read-write only in trusted CI/release builds.
  - name: buildx-cache
    patches:
      - op: remove
        path: /build/artifacts/0/docker
      - op: add
        path: /build/artifacts/0/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: frontend/Dockerfile
      - op: remove
        path: /build/artifacts/1/docker
      - op: add
        path: /build/artifacts/1/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: workers/polytope-fe-worker/Dockerfile
      - op: remove
        path: /build/artifacts/2/docker
      - op: add
        path: /build/artifacts/2/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: workers/fdb-worker/Dockerfile
      - op: remove
        path: /build/artifacts/3/docker
      - op: add
        path: /build/artifacts/3/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: workers/mars-worker/Dockerfile
      - op: remove
        path: /build/artifacts/4/docker
      - op: add
        path: /build/artifacts/4/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: workers/test-worker/Dockerfile
      - op: remove
        path: /build/artifacts/5/docker
      - op: add
        path: /build/artifacts/5/custom
        value:
          buildCommand: .github/scripts/buildx-build.sh
          dependencies:
            dockerfile:
              path: loadgen/Dockerfile

  # ── Podman / no-BuildKit profile ───────────────────────────────────────────
  #
  # For local builds on a host where `docker` is a podman shim and buildx is
  # unavailable. Skaffold then shells out to plain `docker build`, i.e. podman,
  # which implements `RUN --mount=type=secret` itself rather than via BuildKit,
  # so the GIT_AUTH_TOKEN mounts in the Dockerfiles still resolve.
  #
  # Requires GH_TOKEN in the environment (the `secrets` entries map it to the
  # GIT_AUTH_TOKEN secret id) and a `docker login eccr.ecmwf.int` if pushing.
  #
  #   skaffold build --profile podman --push=false \
  #     --build-image eccr.ecmwf.int/polytope/test-worker
  #
  - name: podman
    patches:
      - op: replace
        path: /build/local/useBuildkit
        value: false
      # Podman's layer cache is per-image and local; one build at a time keeps
      # the shared base-image layers from being pulled twice concurrently.
      - op: replace
        path: /build/local/concurrency
        value: 1
