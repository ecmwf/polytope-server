[package]
name = "mars-worker"
version = "0.1.1"
edition = "2024"

[dependencies]
polytope-observability = { path = "../../observability" }
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.22", default-features = false, features = [
  "v1_28",
] }
kube = { version = "0.91", default-features = false, features = [
  "client",
  "rustls-tls",
] }
mars-client = { git = "https://github.com/ecmwf/mars-client-cpp", rev = "d0670436490d1c62e916a04fc15d3291b98027e7" }
polytope-worker-common = { path = "../common" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# malloc_trim(3) is a glibc extension; musl and non-Linux targets do not
# provide the symbol, so scope the dependency to the same cfg as its use.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"
