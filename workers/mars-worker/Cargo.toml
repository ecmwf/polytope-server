[package]
name = "mars-worker"
version = "0.1.1"
edition = "2024"

[dependencies]
polytope-observability = { path = "../../observability" }
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
k8s-openapi = { version = "0.22", default-features = false, features = [
  "v1_28",
] }
kube = { version = "0.91", default-features = false, features = [
  "client",
  "rustls-tls",
] }
log = { version = "0.4", features = ["std"] }
mars-client = { package = "mars-client-rs", git = "https://github.com/ecmwf/mars-client-cpp", rev = "aa8009d469b0892bcc4cbb33067c8ab5ea9eb47c" }
polytope-worker-common = { path = "../common" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
] }
serde_json = "1"
serde_yml = "0.0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# malloc_trim(3) is a glibc extension; musl and non-Linux targets do not
# provide the symbol, so scope the dependency to the same cfg as its use.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

# The wrapper ecosystem must share one native metkit and ecCodes instance.
# Transitive manifests still reference the playground copy and metkit's binding branch.
[patch."ssh://git@github.com/ecmwf/rust-wrappers-playground.git"]
eccodes-sys = { git = "ssh://git@github.com/ecmwf/eccodes.git", branch = "develop" }

[patch."ssh://git@github.com/ecmwf/metkit.git"]
metkit-sys = { git = "https://github.com/ecmwf/metkit.git", rev = "26dfea4f" }
