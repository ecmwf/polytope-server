name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SKAFFOLD_SHA256: 8f62095ba8c282c03ad7b4987fbaf4f29b289fd6cbafb0351effd49f73f0240d
  SKAFFOLD_VERSION: v2.18.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Configure private repo access
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
      - name: Strip local path patches
        run: sed -i '/^\[patch\./,$d' Cargo.toml
      - name: Frontend unit tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy ALL_PROXY all_proxy
          cargo test --locked -p polytope-server
      - name: Integration tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy ALL_PROXY all_proxy
          cargo test --locked -p polytope-server-integration-tests

  skaffold-validate:
    name: Validate Skaffold config
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: dummy
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install Skaffold
        run: |
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64" -o skaffold
          echo "${SKAFFOLD_SHA256}  skaffold" | sha256sum --check -
          sudo install skaffold /usr/local/bin/skaffold
      - name: Validate Skaffold configuration
        run: skaffold diagnose --yaml-only --filename skaffold.yaml >/dev/null

  # Builds images (no push) on PRs. Skips any image whose tag already exists
  # in ECCR — if the tag is there it was already built and published successfully.
  image-build:
    name: Build / ${{ matrix.image }}
    needs: [fmt, test, skaffold-validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: eccr.ecmwf.int/polytope/frontend
            tag_file: frontend/TAG
          - image: eccr.ecmwf.int/polytope/polytope-fe-worker
            tag_file: workers/polytope-fe-worker/TAG
          - image: eccr.ecmwf.int/polytope/fdb-worker
            tag_file: workers/fdb-worker/TAG
          - image: eccr.ecmwf.int/polytope/mars-worker
            tag_file: workers/mars-worker/TAG
          - image: eccr.ecmwf.int/polytope/test-worker
            tag_file: workers/test-worker/TAG
          - image: eccr.ecmwf.int/polytope/polytope-loadgen
            tag_file: loadgen/TAG
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Log in to ECCR
        env:
          ECCR_PASSWORD: ${{ secrets.ECCR_PASSWORD }}
          ECCR_USERNAME: ${{ secrets.ECCR_USERNAME }}
        run: printf '%s' "$ECCR_PASSWORD" | docker login eccr.ecmwf.int --username "$ECCR_USERNAME" --password-stdin

      - name: Check if image tag already exists
        id: check
        run: |
          tag=$(cat "${{ matrix.tag_file }}")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${{ matrix.image }}:${tag}" >/dev/null 2>&1; then
            echo "${{ matrix.image }}:${tag} already published; skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare repository token
        if: steps.check.outputs.skip == 'false'
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Skaffold
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64" -o skaffold
          echo "${SKAFFOLD_SHA256}  skaffold" | sha256sum --check -
          sudo install skaffold /usr/local/bin/skaffold

      - name: Build ${{ matrix.image }} (no push)
        if: steps.check.outputs.skip == 'false'
        env:
          FIXED_TAG: ${{ steps.check.outputs.tag }}
        run: skaffold build --push=false --filename skaffold.yaml --build-image "${{ matrix.image }}"

  # Publishes images to ECCR on push to main. Skips any image whose tag already
  # exists — idempotent, safe to re-run.
  publish:
    name: Publish / ${{ matrix.image }}
    needs: [fmt, test, skaffold-validate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: eccr.ecmwf.int/polytope/frontend
            tag_file: frontend/TAG
          - image: eccr.ecmwf.int/polytope/polytope-fe-worker
            tag_file: workers/polytope-fe-worker/TAG
          - image: eccr.ecmwf.int/polytope/fdb-worker
            tag_file: workers/fdb-worker/TAG
          - image: eccr.ecmwf.int/polytope/mars-worker
            tag_file: workers/mars-worker/TAG
          - image: eccr.ecmwf.int/polytope/test-worker
            tag_file: workers/test-worker/TAG
          - image: eccr.ecmwf.int/polytope/polytope-loadgen
            tag_file: loadgen/TAG
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Log in to ECCR
        env:
          ECCR_PASSWORD: ${{ secrets.ECCR_PASSWORD }}
          ECCR_USERNAME: ${{ secrets.ECCR_USERNAME }}
        run: printf '%s' "$ECCR_PASSWORD" | docker login eccr.ecmwf.int --username "$ECCR_USERNAME" --password-stdin

      - name: Check if image tag already exists
        id: check
        run: |
          tag=$(cat "${{ matrix.tag_file }}")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${{ matrix.image }}:${tag}" >/dev/null 2>&1; then
            echo "${{ matrix.image }}:${tag} already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare repository token
        if: steps.check.outputs.skip == 'false'
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install Skaffold
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64" -o skaffold
          echo "${SKAFFOLD_SHA256}  skaffold" | sha256sum --check -
          sudo install skaffold /usr/local/bin/skaffold

      - name: Build and publish ${{ matrix.image }}
        if: steps.check.outputs.skip == 'false'
        env:
          FIXED_TAG: ${{ steps.check.outputs.tag }}
        run: skaffold build --push=true --filename skaffold.yaml --build-image "${{ matrix.image }}"

  # Creates a GitHub release when the VERSION file changes on main.
  # Runs after publish so images are available before the release is announced.
  create-release:
    name: Create release
    needs: [publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether VERSION changed
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current=$(cat VERSION 2>/dev/null || echo "")
          if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            previous=""
          else
            previous=$(git show "${BEFORE_SHA}:VERSION" 2>/dev/null || echo "")
          fi
          echo "current=$current  previous=$previous"
          if [[ -z "$current" || "$current" == "$previous" ]]; then
            echo "VERSION unchanged; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${current}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --target "${{ github.sha }}" \
            --generate-notes
