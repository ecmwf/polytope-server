# Images are built only by release.yaml; CI compiles the workspace and lints
# the Dockerfiles instead.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SKAFFOLD_SHA256: 8f62095ba8c282c03ad7b4987fbaf4f29b289fd6cbafb0351effd49f73f0240d
  SKAFFOLD_VERSION: v2.18.0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Configure private repo access
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"
      - name: Image fingerprints
        run: tools/release/image-fingerprint.sh --all
      - name: Strip local path patches
        run: sed -i '/^\[patch\./,$d' Cargo.toml
      # mars-worker and utils/metkit are excluded from the workspace (they need
      # native MARS libraries) and are only compiled by the release build.
      - name: Compile workspace
        run: cargo check --workspace --all-targets --locked
      - name: Frontend unit tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy ALL_PROXY all_proxy
          cargo test --locked -p polytope-server
      - name: Integration tests
        env:
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          unset HTTP_PROXY http_proxy HTTPS_PROXY https_proxy ALL_PROXY all_proxy
          cargo test --locked -p polytope-server-integration-tests

  skaffold-validate:
    name: Validate Skaffold config
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Skaffold
        run: |
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64" -o skaffold
          echo "${SKAFFOLD_SHA256}  skaffold" | sha256sum --check -
          sudo install skaffold /usr/local/bin/skaffold
      - name: Validate Skaffold configuration
        run: skaffold diagnose --yaml-only --filename skaffold.yaml >/dev/null

  # Static Dockerfile validation, no build. `--check` resolves every base image,
  # and some are private ECCR images, so it needs the registry login; fork PRs
  # have no access to the secrets and are skipped.
  dockerfile-lint:
    name: Lint ${{ matrix.dockerfile }}
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - frontend/Dockerfile
          - workers/polytope-fe-worker/Dockerfile
          - workers/fdb-worker/Dockerfile
          - workers/mars-worker/Dockerfile
          - workers/test-worker/Dockerfile
          - loadgen/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ECCR
        env:
          ECCR_PASSWORD: ${{ secrets.ECCR_PASSWORD }}
          ECCR_USERNAME: ${{ secrets.ECCR_USERNAME }}
        run: printf '%s' "$ECCR_PASSWORD" | docker login eccr.ecmwf.int --username "$ECCR_USERNAME" --password-stdin
      - name: Validate Dockerfile
        run: docker buildx build --check --file "${{ matrix.dockerfile }}" .
