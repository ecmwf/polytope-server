# Publishes the application images on GitHub release.
#
# Every image built by a release is tagged with the release tag. An image is
# only rebuilt when its content fingerprint (tools/release/image-fingerprint.sh)
# differs from the one recorded in the previous release's images.json;
# otherwise the previous release's tag + digest are carried forward. So an
# image tag always names the release whose source built it, and a release that
# only touches the frontend's dependencies publishes only a new frontend.
#
# The result is published as `images.json` on the release (and as a table in
# the release notes): one entry per image with tag, digest, fingerprint, source
# revision and whether this release rebuilt it. Deployment config should take
# image tags from there.

name: Release images

on:
  release:
    types:
      - published

permissions:
  contents: read

# Default `run` steps use `bash -e {0}` without pipefail, which would let a
# failing command on the left of a pipe go unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: eccr.ecmwf.int/polytope

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any_changed: ${{ steps.plan.outputs.any_changed }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version, got '$TAG'" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable

      - name: Configure access to private git dependencies
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"

      - name: Compute image fingerprints
        run: |
          tools/release/image-fingerprint.sh --all > fingerprints.txt
          cat fingerprints.txt

      - name: Log in to ECCR
        env:
          ECCR_PASSWORD: ${{ secrets.ECCR_PASSWORD }}
          ECCR_USERNAME: ${{ secrets.ECCR_USERNAME }}
        run: printf '%s' "$ECCR_PASSWORD" | docker login eccr.ecmwf.int --username "$ECCR_USERNAME" --password-stdin

      # Walk back through release tags on this history until one carries an
      # images.json. If none does (first release under this scheme), every
      # image is rebuilt.
      - name: Fetch previous release manifest
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ref="$TAG"
          for _ in $(seq 1 20); do
            prev=$(git describe --tags --abbrev=0 --match '[0-9]*' "$ref^" 2>/dev/null) || break
            if gh release download "$prev" --repo "${{ github.repository }}" --pattern images.json --output previous.json 2>/dev/null; then
              echo "previous=$prev" >> "$GITHUB_OUTPUT"
              echo "Carrying forward from release $prev"
              exit 0
            fi
            ref="$prev"
          done
          echo "No previous release with images.json found; all images will be built."
          echo '{"images":{}}' > previous.json

      - name: Build plan
        id: plan
        env:
          TAG: ${{ github.event.release.tag_name }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: |
          jq -n --arg tag "$TAG" --arg previous "$PREVIOUS" --arg registry "$REGISTRY" --arg sha "$GITHUB_SHA" \
             --rawfile fps fingerprints.txt --slurpfile prev previous.json '
            ($fps | split("\n") | map(select(length > 0) | split(" ") | {key: .[0], value: .[1]}) | from_entries) as $fp
            | {
                release: $tag,
                previous: (if $previous == "" then null else $previous end),
                images: ($fp | to_entries | map({
                  key: .key,
                  value: (
                    ($prev[0].images[.key] // null) as $p
                    | if $p != null and $p.fingerprint == .value then
                        {image: $p.image, tag: $p.tag, digest: $p.digest, fingerprint: .value, revision: ($p.revision // null), changed: false}
                      else
                        {image: ($registry + "/" + .key), tag: $tag, digest: null, fingerprint: .value, revision: $sha, changed: true}
                      end)
                }) | from_entries)
              }' > plan.json

          # A carried-forward image that is no longer in the registry (retention,
          # manual cleanup) would be advertised forever. The fingerprint says its
          # content is unchanged, so rebuild it under this release's tag instead.
          for artifact in $(jq -r '.images | to_entries[] | select(.value.changed | not) | .key' plan.json); do
            ref=$(jq -r --arg a "$artifact" '.images[$a] | .image + "@" + .digest' plan.json)
            if err=$(docker manifest inspect "$ref" 2>&1 >/dev/null); then
              continue
            fi
            # Only a definite "no such manifest" means the image is gone. A
            # registry/network error must not turn into a rebuild of everything.
            if ! grep -qiE 'manifest unknown|no such manifest|artifact [^ ]+ not found' <<<"$err"; then
              echo "::error::could not check carried-forward image $ref: $err" >&2
              exit 1
            fi
            echo "::warning::carried-forward image $ref is not in the registry; rebuilding $artifact"
            jq --arg a "$artifact" --arg tag "$TAG" --arg registry "$REGISTRY" --arg sha "$GITHUB_SHA" \
              '.images[$a] |= {image: ($registry + "/" + $a), tag: $tag, digest: null, fingerprint: .fingerprint, revision: $sha, changed: true}' \
              plan.json > plan.next
            mv plan.next plan.json
          done
          jq . plan.json

          changed=$(jq -c '[.images | to_entries[] | select(.value.changed) | {artifact: .key, image: .value.image}]' plan.json)
          echo "matrix={\"include\":$changed}" >> "$GITHUB_OUTPUT"
          echo "any_changed=$(jq -r 'length > 0' <<<"$changed")" >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan for $TAG"
            echo
            jq -r '.images | to_entries[] | "- \(.key): \(if .value.changed then "**build**" else "carry forward \(.value.tag)" end)"' plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: plan.json
          retention-days: 7
          overwrite: true

  publish:
    name: Publish ${{ matrix.artifact }}
    needs: plan
    if: needs.plan.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      SKAFFOLD_SHA256: 8f62095ba8c282c03ad7b4987fbaf4f29b289fd6cbafb0351effd49f73f0240d
      SKAFFOLD_VERSION: v2.18.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ECCR
        env:
          ECCR_PASSWORD: ${{ secrets.ECCR_PASSWORD }}
          ECCR_USERNAME: ${{ secrets.ECCR_USERNAME }}
        run: printf '%s' "$ECCR_PASSWORD" | docker login eccr.ecmwf.int --username "$ECCR_USERNAME" --password-stdin

      # Tags are immutable. The plan only lists images whose inputs changed, so
      # an existing tag normally means a previous run of this same release
      # already published it (e.g. a re-run after a partial failure). Make sure
      # it was built from this release's commit: a release that was deleted and
      # re-created on another commit must not adopt the old image.
      - name: Check if image tag already exists
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if docker manifest inspect "${{ matrix.image }}:${TAG}" >/dev/null 2>&1; then
            revision=$(docker buildx imagetools inspect --format '{{json .Image}}' "${{ matrix.image }}:${TAG}" \
              | jq -r '[ (if has("config") then . else .[] end) | .config.Labels["org.opencontainers.image.revision"] // empty ] | first // ""')
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "::error::${{ matrix.image }}:${TAG} exists but was built from '${revision:-unknown}', not $GITHUB_SHA. Tags are immutable; cut a new release." >&2
              exit 1
            fi
            echo "${{ matrix.image }}:${TAG} already published from this revision; skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare repository token
        if: steps.check.outputs.skip == 'false'
        env:
          RAW_GH_TOKEN: ${{ secrets.GH_REPO_READ_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_GH_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Install Skaffold
        if: steps.check.outputs.skip == 'false'
        run: |
          tool_dir="$RUNNER_TEMP/skaffold"
          mkdir -p "$tool_dir"
          curl -fsSL "https://storage.googleapis.com/skaffold/releases/${SKAFFOLD_VERSION}/skaffold-linux-amd64" -o "$tool_dir/skaffold"
          echo "${SKAFFOLD_SHA256}  $tool_dir/skaffold" | sha256sum --check -
          chmod +x "$tool_dir/skaffold"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Build and publish ${{ matrix.artifact }}
        if: steps.check.outputs.skip == 'false'
        env:
          FIXED_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ github.event.release.tag_name }}
          REVISION: ${{ github.sha }}
          BUILDKIT_CACHE_MODE: read-write
        run: skaffold build --cache-artifacts=false --push=true --filename skaffold.yaml --profile buildx-cache --build-image "${{ matrix.image }}"

      - name: Record published image digest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${{ matrix.image }}:${TAG}")"
          # A malformed value would end up in images.json as the image digest.
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::unexpected digest for ${{ matrix.image }}:${TAG}: '$digest'" >&2
            exit 1
          fi
          mkdir -p published
          jq -n --arg artifact "${{ matrix.artifact }}" --arg digest "$digest" \
            '{artifact: $artifact, digest: $digest}' > "published/${{ matrix.artifact }}.json"
          {
            echo "### Published ${{ matrix.artifact }}"
            echo
            echo "- Image: \`${{ matrix.image }}@$digest\`"
            echo "- Source revision: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-${{ matrix.artifact }}
          path: published/${{ matrix.artifact }}.json
          retention-days: 7
          overwrite: true

  manifest:
    name: Publish images.json
    needs: [plan, publish]
    # Run when nothing needed building (publish skipped) or when every build
    # succeeded. A partial failure leaves the release without a manifest; fix
    # and re-run the workflow, already-published images are detected and skipped.
    if: always() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Assemble images.json
        run: |
          shopt -s nullglob
          # Fill in the digests recorded by the publish jobs.
          jq -s '
            (.[1:] | map({key: .artifact, value: .digest}) | from_entries) as $digests
            | .[0]
            | .images |= with_entries(
                if .value.changed then .value.digest = $digests[.key] else . end)
          ' artifacts/plan/plan.json artifacts/published-*/*.json > images.json
          jq -e '[.images[] | .digest != null] | all' images.json >/dev/null \
            || { echo "images.json is missing digests:" >&2; jq . images.json >&2; exit 1; }
          jq . images.json

      - name: Attach images.json to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" images.json --clobber --repo "${{ github.repository }}"

      - name: Append image table to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          table=$(jq -r '
            "<!-- images:start -->", "## Images", "",
            "| Image | Tag | Changed | Digest |", "|---|---|---|---|",
            (.images | to_entries[] |
              "| `\(.value.image)` | `\(.value.tag)` | \(if .value.changed then "yes" else "no" end) | `\(.value.digest)` |"),
            "", "<!-- images:end -->"
          ' images.json)
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body // ""' | tr -d '\r')
          # Idempotent on re-runs: replace the bounded images block, leave the
          # rest of the (possibly hand-edited) notes alone. With one marker
          # missing the sed range below would eat the rest of the notes.
          starts=$(grep -c '<!-- images:start -->' <<<"$body" || true)
          ends=$(grep -c '<!-- images:end -->' <<<"$body" || true)
          if [[ "$starts" != "$ends" || "$starts" -gt 1 ]]; then
            echo "::error::release notes have unbalanced images markers (start=$starts, end=$ends); fix or remove them and re-run" >&2
            exit 1
          fi
          body=$(printf '%s\n' "$body" | sed '/<!-- images:start -->/,/<!-- images:end -->/d')
          printf '%s\n\n%s\n' "$body" "$table" > notes.md
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
