# ─── C++ library base images ────────────────────────────────────────────────
#
# Standalone skaffold config for the pre-built C++ dependency images. These are
# NOT part of the application build (../../skaffold.yaml): app images pull them
# from ECCR by pinned tag. Run from THIS directory (docker/cpp-libs/) —
# skaffold resolves each artifact's context (e.g. `metkit`) relative to the
# current working directory, not to this file.
#
# Tag policy (mirrors the root skaffold.yaml):
#   Dev build  — omit FIXED_TAG; skaffold derives the tag from the git commit.
#                Use PREFIX= for an optional prefix (e.g. 'dev-').
#   Release    — set FIXED_TAG=$(cat <image>/TAG); the TAG file is the source
#                of truth for what gets published and consumed.
#
#   # dev: push a one-off test image
#   cd docker/cpp-libs
#   GH_TOKEN=... skaffold build --push -f skaffold.yaml \
#     -b eccr.ecmwf.int/polytope/cpp-mars-libs
#
#   # release: publish the canonical versioned image
#   FIXED_TAG=$(cat mars/TAG) GH_TOKEN=... skaffold build --push \
#     -f skaffold.yaml -b eccr.ecmwf.int/polytope/cpp-mars-libs
#
# Environment variables:
#   FIXED_TAG   release tag (from TAG file); if unset, tag derives from git commit
#   PREFIX      optional tag prefix for dev builds (e.g. 'dev-')
#   GH_TOKEN    GitHub token — only required for cpp-mars-libs (private clones)
#   RPM_REPO    Nexus URL — only for cpp-mars-libs with MARS_BUILD_FROM_SOURCE=false
# ────────────────────────────────────────────────────────────────────────────

apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: cpp-libs

build:
  artifacts:
    - image: eccr.ecmwf.int/polytope/cpp-metkit-libs
      context: metkit
      docker:
        dockerfile: Dockerfile
        target: libs
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-fdb-libs
      context: fdb
      docker:
        dockerfile: Dockerfile
        target: libs
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-fdb-gribjump-libs
      context: fdb-gribjump
      docker:
        dockerfile: Dockerfile
        target: libs
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-mars-libs
      context: mars
      docker:
        dockerfile: Dockerfile
        target: libs
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'
          GIT_AUTH_TOKEN: '{{ default "" .GH_TOKEN }}'
          rpm_repo: '{{ default "" .RPM_REPO }}'

    # ─── Debug companions ──────────────────────────────────────────────────
    # Same build args and git-derived tag as the stripped counterpart, so
    # both images are always co-published under the same tag.
    - image: eccr.ecmwf.int/polytope/cpp-metkit-libs-debug
      context: metkit
      docker:
        dockerfile: Dockerfile
        target: libs-debug
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-fdb-libs-debug
      context: fdb
      docker:
        dockerfile: Dockerfile
        target: libs-debug
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-fdb-gribjump-libs-debug
      context: fdb-gribjump
      docker:
        dockerfile: Dockerfile
        target: libs-debug
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'

    - image: eccr.ecmwf.int/polytope/cpp-mars-libs-debug
      context: mars
      docker:
        dockerfile: Dockerfile
        target: libs-debug
        buildArgs:
          VERSION: '{{ default "" .FIXED_TAG }}'
          GIT_AUTH_TOKEN: '{{ default "" .GH_TOKEN }}'
          rpm_repo: '{{ default "" .RPM_REPO }}'

  tagPolicy:
    customTemplate:
      template: '{{if .FIXED_TAG}}{{.FIXED_TAG}}{{else}}{{.PREFIX}}{{.GIT_TAG}}{{end}}'
      components:
        - name: FIXED_TAG
          envTemplate:
            template: '{{default "" .FIXED_TAG}}'
        - name: PREFIX
          envTemplate:
            template: '{{default "" .PREFIX}}'
        - name: GIT_TAG
          gitCommit:
            ignoreChanges: true
  platforms:
    - linux/amd64
  local:
    useDockerCLI: true
    concurrency: 1
