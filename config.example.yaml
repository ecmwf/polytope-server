server:
  host: "0.0.0.0"   # optional, default 0.0.0.0
  port: 3000         # optional, default 3000

# Deployment identity used for opaque BITS request IDs.
# Tags must be 1-3 lower-case alphanumeric characters.
polytope:
  site: "bol"
  env: "dev"

# Optional — Prometheus metrics scrape endpoint.
# Omit the section entirely to disable (zero-cost no-op).
# Requires the binary to be built with --features telemetry.
# metrics:
#   enabled: true
#   port: 9090       # default 9090

bits:
  routes:
    - default:
        - target::http:
            url: "http://your-backend/"   # replace with real target

# Optional — /chunks/v1 chunk API (polytope-zarr). Omit the section to leave
# the API unmounted. Metadata expansion needs the binary built with
# --features metkit (otherwise /metadata returns 501).
# chunks:
#   enabled: true                 # default true when the section is present
#   max_chunk_cost: 20000000      # max fields x points per extract (default 20M)
#   grids:                        # grid registry: first match wins, no match -> 400
#     - collection: destination-earth
#       match:                    # subset match on the metkit-canonical request
#         class: d1
#         dataset: climate-dt
#         resolution: high        # scalar or list of allowed canonical values
#       count_values: 12582912
#       md5_grid_section: null    # or "<hex>"; echoed as extract.grid_hash
