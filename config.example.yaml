server:
  host: "0.0.0.0"   # optional, default 0.0.0.0
  port: 3000         # optional, default 3000

# Deployment identity used for opaque BITS request IDs.
# Tags must be 1-3 lower-case alphanumeric characters.
polytope:
  site: "bol"
  env: "dev"

# Optional — Prometheus metrics scrape endpoint.
# Omit the section entirely to disable (zero-cost no-op).
# Requires the binary to be built with --features telemetry.
# metrics:
#   enabled: true
#   port: 9090       # default 9090

# Optional — when the v1 API may forward the caller's Accept-Encoding, and so
# when a v1 result may be delivered content-encoded. polytope-client below
# 0.7.7 failed encoded downloads, so v1 withholds the header from those
# clients. Lower the minimum once they are gone; set `enabled: false` to stop
# v1 forwarding altogether. v2, EDR and MCP are unaffected.
# result_encoding:
#   enabled: true
#   min_polytope_client_version: "0.7.7"

bits:
  routes:
    - default:
        - target::http:
            url: "http://your-backend/"   # replace with real target
